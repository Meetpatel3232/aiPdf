services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: dockmind-backend

    ports:
      - "5000:5000"

    env_file:
      - ./backend/.env

    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

      args:
        VITE_API_URL: http://localhost:5000/api

    container_name: dockmind-frontend

    ports:
      - "3000:80"

    depends_on:
      - backend

    restart: unless-stopped